# Copy these entries to ~/.codex/config.toml or a trusted project's
# .codex/config.toml. The entry names must match .mcp-filter.json entries.

[mcp_servers.tracker]
command = "mcp-filter"
args = [
  "tracker",
  "--",
  "npx", "-y", "@acme/tracker-mcp"
]

[mcp_servers.remote-docs]
command = "mcp-filter"
args = [
  "remote-docs",
  "--transport", "streamable-http",
  "--url", "https://mcp.example.com/mcp",
  "--header-env", "Authorization=REMOTE_DOCS_TOKEN"
]
env_vars = ["REMOTE_DOCS_TOKEN"]

[mcp_servers.legacy-events]
command = "mcp-filter"
args = [
  "legacy-events",
  "--transport", "sse",
  "--url", "https://events.example.com/sse"
]
